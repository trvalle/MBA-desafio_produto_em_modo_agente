name: catraca
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - catraca-data:/app/data
    environment:
      PARTNER_API_KEY: catraca-partner-local
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  catraca-data:
